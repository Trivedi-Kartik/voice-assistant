appId: co.dyrect.karvix
productName: Karvix
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
win:
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallDirectory: true
  createDesktopShortcut: true
publish:
  provider: github
  owner: Trivedi-Kartik
  repo: voice-assistant
